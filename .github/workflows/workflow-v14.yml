name: workflow-v1.4 host compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: Project hosts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Host, recovery, shipping and workflow regressions
        run: npx vitest run src/orchestration src/hosts src/team/__tests__/workflow src/__tests__/plugin-shipping-surface.test.ts src/cli/__tests__/project-launch.test.ts src/cli/commands/__tests__/orchestrator.test.ts src/cli/commands/__tests__/team-workflow.test.ts --maxWorkers=2
      - name: Create package
        run: npm pack --ignore-scripts --pack-destination .
      - name: Clean package installation and project lifecycle
        run: npm run smoke:project-hosts -- oh-my-claude-sisyphus-5.4.0.tgz
